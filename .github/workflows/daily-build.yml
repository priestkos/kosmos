name: Daily build

on:
  schedule:
    - cron: "17 6 * * *"   # every day at 06:17 UTC (about 11:47 IST)
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write            # needed to push the daily commit

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Add your real build step here if the site ever needs one
      # (e.g. npm ci && npm run build). The site is static right now.

      - name: Record build timestamp
        run: |
          echo "Last automated build: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > .last-build
          echo "Runs daily via .github/workflows/daily-build.yml" >> .last-build

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .last-build
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: daily automated build $(date -u +%F)"
            git push
          fi
